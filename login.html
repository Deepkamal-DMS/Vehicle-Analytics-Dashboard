<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Log in to the DeepKamal Vehicle Analytics Dashboard"
    >

    <meta
        name="theme-color"
        content="#0b1f4b"
    >

    <title>Log In - DeepKamal Vehicle Analytics Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Same stylesheet as the dashboard - the login card reuses its
         .modal/.login-form rules rather than duplicating them. -->
    <link
        rel="stylesheet"
        href="style.css?v=44"
    >

</head>

<body>

    <!-- =========================================================
         LOGIN

         The dashboard's front door (see index.html's bootstrapApp(),
         which sends any visit without a session here). Reuses the
         .modal-overlay/.modal shell as a full-page background rather
         than an overlay on top of something else, since there is
         nothing behind it on this page.
         ========================================================= -->

    <div class="modal-overlay">

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="loginModalTitle"
        >

            <div class="modal__head">

                <h2 id="loginModalTitle">Log In</h2>

            </div>

            <div class="modal__body">

                <form id="loginForm" class="login-form">

                    <label class="login-form__field">
                        Username
                        <input
                            type="text"
                            id="loginUser"
                            autocomplete="username"
                            required
                        >
                    </label>

                    <label class="login-form__field">
                        Password
                        <input
                            type="password"
                            id="loginPass"
                            autocomplete="current-password"
                            required
                        >
                    </label>

                    <p id="loginError" class="login-form__error" hidden></p>

                    <button
                        type="submit"
                        id="loginSubmit"
                        class="import-button import-button--primary"
                    >
                        Log In
                    </button>

                    <button
                        type="button"
                        id="showSignupLink"
                        class="login-form__switch"
                    >
                        New dealer? Create your own login
                    </button>

                </form>

                <!--
                     Hidden until "New dealer?" is clicked. Every
                     account made here lands with canManageUsers =
                     false server-side (see local/server/server.js's
                     mode=signup) - this form has no field for it, and
                     could not grant it even if one were added, since
                     the server ignores anything but name/username/
                     password/dealership for this mode.

                     autocomplete="off" on the form plus a dedicated
                     value per field, same reasoning as profile.html's
                     "Add a login" form - "off" alone does not stop
                     Chrome offering to autofill/save a password field.
                -->
                <form
                    id="signupForm"
                    class="login-form"
                    autocomplete="off"
                    hidden
                >

                    <label class="login-form__field">
                        Name
                        <input
                            type="text"
                            id="signupName"
                            autocomplete="off"
                            required
                        >
                    </label>

                    <label class="login-form__field">
                        Username
                        <input
                            type="text"
                            id="signupUsername"
                            autocomplete="off"
                            required
                        >
                    </label>

                    <label class="login-form__field">
                        Password
                        <input
                            type="password"
                            id="signupPassword"
                            autocomplete="new-password"
                            required
                        >
                    </label>

                    <label class="login-form__field">
                        Dealership
                        <input
                            type="text"
                            id="signupDealership"
                            autocomplete="off"
                        >
                    </label>

                    <p id="signupError" class="login-form__error" hidden></p>

                    <button
                        type="submit"
                        id="signupSubmit"
                        class="import-button import-button--primary"
                    >
                        Create Login
                    </button>

                    <button
                        type="button"
                        id="showLoginLink"
                        class="login-form__switch"
                    >
                        Already have a login? Log in instead
                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="auth.js?v=2"></script>
    <script src="login.js?v=3"></script>

</body>
</html>
