<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Log in to the Vehicle Registration Analytics Dashboard"
    >

    <meta
        name="theme-color"
        content="#0b1f4b"
    >

    <title>Log In - Vehicle Registration Dashboard</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Same stylesheet as the dashboard - the login card reuses its
         .modal/.login-form rules rather than duplicating them. -->
    <link
        rel="stylesheet"
        href="style.css?v=27"
    >

</head>

<body>

    <!-- =========================================================
         LOGIN

         The dashboard's front door (see index.html's bootstrapApp(),
         which sends any visit without a session here). Reuses the
         .modal-overlay/.modal shell as a full-page background rather
         than an overlay on top of something else, since there is
         nothing behind it on this page.
         ========================================================= -->

    <div class="modal-overlay">

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="loginModalTitle"
        >

            <div class="modal__head">

                <h2 id="loginModalTitle">Log In</h2>

            </div>

            <div class="modal__body">

                <form id="loginForm" class="login-form">

                    <label class="login-form__field">
                        Username
                        <input
                            type="text"
                            id="loginUser"
                            autocomplete="username"
                            required
                        >
                    </label>

                    <label class="login-form__field">
                        Password
                        <input
                            type="password"
                            id="loginPass"
                            autocomplete="current-password"
                            required
                        >
                    </label>

                    <p id="loginError" class="login-form__error" hidden></p>

                    <button
                        type="submit"
                        id="loginSubmit"
                        class="import-button import-button--primary"
                    >
                        Log In
                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script src="auth.js?v=1"></script>
    <script src="login.js?v=1"></script>

</body>
</html>
